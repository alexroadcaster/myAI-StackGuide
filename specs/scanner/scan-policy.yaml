{
  "schema_version": "1.1.0",
  "policy_id": "local-scan-v1.1",
  "platform": "windows_local_disk",
  "source_access": "bounded_relevant_context",
  "network": false,
  "execute_project": false,
  "install_dependencies": false,
  "modes": {
    "quick": {
      "max_files": 250,
      "max_bytes": 33554432,
      "max_seconds": 60
    },
    "standard": {
      "max_files": 2000,
      "max_bytes": 268435456,
      "max_seconds": 480
    },
    "deep": {
      "max_files": 10000,
      "max_bytes": 2147483648,
      "max_seconds": 1800
    }
  },
  "topology": {
    "quick": {
      "max_entries": 50000,
      "max_depth": 20,
      "max_seconds": 20
    },
    "standard": {
      "max_entries": 250000,
      "max_depth": 40,
      "max_seconds": 90
    },
    "deep": {
      "max_entries": 1000000,
      "max_depth": 50,
      "max_seconds": 300
    }
  },
  "max_file_bytes": {
    "quick": 1048576,
    "standard": 2097152,
    "deep": 4194304
  },
  "max_response_bytes": 262144,
  "targeted_context": {
    "quick": {
      "max_files": 16,
      "max_read_bytes": 1048576,
      "max_model_context_bytes": 24576
    },
    "standard": {
      "max_files": 64,
      "max_read_bytes": 8388608,
      "max_model_context_bytes": 49152
    },
    "deep": {
      "max_files": 256,
      "max_read_bytes": 67108864,
      "max_model_context_bytes": 65536
    },
    "charge_to_scan_budget": true,
    "persist_excerpts": false
  },
  "mode_budget_warning_fraction": 0.8,
  "deep_checkpoint": {
    "max_files_between_checkpoints": 2000,
    "max_bytes_between_checkpoints": 268435456
  },
  "allowed_filenames": [
    "README",
    "README.md",
    "README.rst",
    "package.json",
    "pyproject.toml",
    "requirements.txt",
    "Cargo.toml",
    "go.mod",
    "pom.xml",
    "build.gradle",
    "Dockerfile",
    "compose.yaml",
    "docker-compose.yml",
    "pnpm-workspace.yaml"
  ],
  "allowed_extensions": [
    ".md",
    ".rst",
    ".txt",
    ".json",
    ".toml",
    ".yaml",
    ".yml",
    ".py",
    ".js",
    ".jsx",
    ".ts",
    ".tsx",
    ".go",
    ".rs",
    ".java",
    ".cs",
    ".cpp",
    ".c",
    ".h",
    ".sql"
  ],
  "denied_segments": [
    ".git",
    ".codex",
    ".agents",
    ".ssh",
    ".aws",
    ".azure",
    ".kube",
    ".gnupg",
    ".venv",
    "venv",
    "node_modules",
    "vendor",
    "dist",
    "build",
    "coverage",
    "__pycache__",
    "logs",
    "dumps",
    "exports",
    "secrets",
    "credentials"
  ],
  "denied_filename_globs": [
    ".env*",
    "*secret*",
    "*credential*",
    "*private*key*",
    "id_rsa*",
    "id_ed25519*",
    "*.pem",
    "*.key",
    "*.p12",
    "*.pfx",
    "*.keystore",
    "*.log",
    "*.dump",
    "*.sqlite",
    "*.sqlite3",
    "*.db",
    "*customer*export*"
  ],
  "excluded_output_root": "docs/myai-stackguide",
  "reject_links": true,
  "reject_hardlinks": true,
  "reject_ads": true,
  "classification": {
    "compact_max_eligible_files": 2000,
    "compact_max_manifests": 12,
    "standard_max_eligible_files": 25000,
    "standard_max_manifests": 100,
    "standard_max_service_roots": 50,
    "monorepo_min_service_roots": 2
  },
  "counting": "attempts_and_consumed_bytes_including_failed_reads",
  "deadline": "monotonic_cooperative",
  "deny_precedes_allow": true,
  "precedence": [
    "incomplete_or_monorepo",
    "empty",
    "compact",
    "standard",
    "large"
  ],
  "policy_limits_calibrated": false
}
